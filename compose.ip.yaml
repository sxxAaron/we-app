services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      SERVER_IP: ${SERVER_IP:?请先运行 python3 manage.py init-env --ip 你的服务器公网IPv4}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
