services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      SETUP_TOKEN: ${SETUP_TOKEN:?请先运行 python3 manage.py init-env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      HOST: 0.0.0.0
      PORT: 8080
      DB_PATH: /data/journal.db
    ports:
      - "127.0.0.1:18765:8080"
    volumes:
      - journal-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  journal-data:
